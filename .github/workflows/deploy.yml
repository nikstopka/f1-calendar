name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Update F1 Data
      # The extra cron slot commits under its own workflow name. Without this
      # entry its commits would sit in the repository unpublished, and the site
      # would only pick them up on the next unrelated push.
      - Update F1 Data (extra slot)
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        run: |
          mkdir -p _site
          # Explicit list on purpose: the repository also holds the live-timing
          # service and its logs, which have no business being published. Anything
          # added to the site must be named here or it silently never deploys —
          # that is how news/ and feed.xml stayed off the site until now.
          cp -r index.html favicon.svg favicon.ico apple-touch-icon.png \
                icon-192.png icon-512.png f1-calendar.ics feed.xml \
                data news _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
