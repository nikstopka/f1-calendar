name: Update F1 Data

on:
  schedule:
    # Every 30 minutes — current season only
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      refresh_history:
        description: "Refresh historical seasons too"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch F1 data and generate files
        run: |
          if [ "${{ github.event.inputs.refresh_history }}" = "true" ]; then
            python scripts/update_f1_data.py --refresh-history
          else
            python scripts/update_f1_data.py
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f1-calendar.ics data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update F1 data — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
