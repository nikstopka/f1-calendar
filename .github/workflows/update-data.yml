name: Update F1 Data

on:
  schedule:
    # Every 30 minutes — current season only
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      refresh_history:
        description: "Refresh historical seasons too"
        type: boolean
        default: false
  # Also callable from another workflow, so the extra schedule slot below runs
  # this same job instead of a second copy that could drift apart from it.
  workflow_call:

permissions:
  contents: write

concurrency:
  group: update-data
  # Queue rather than cancel: a half-finished run must not push over a
  # complete one, and two runs committing at once would race on git push.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch F1 data and generate files
        run: |
          # `inputs` covers both workflow_dispatch and workflow_call, unlike
          # github.event.inputs, which is empty when called from another file.
          if [ "${{ inputs.refresh_history }}" = "true" ]; then
            python scripts/update_f1_data.py --refresh-history
          else
            python scripts/update_f1_data.py
          fi

      - name: Build Live View data (OpenF1)
        continue-on-error: true
        run: python scripts/update_live_data.py

      - name: Build News data (formula1.com)
        # Scraping the rendered page is the only route to the same headlines the
        # F1 app shows. continue-on-error keeps a layout change from blocking
        # the calendar update — the News tab shows its "not built yet" note.
        continue-on-error: true
        run: python scripts/update_news.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f1-calendar.ics data/ news/ feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update F1 data — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
